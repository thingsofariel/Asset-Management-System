services:
  postgres:
    image: postgres:16
    container_name: asset_mgmt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: asset_mgmt
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
